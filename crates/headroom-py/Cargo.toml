[package]
name = "headroom-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing headroom-core to Python as headroom._core."
# Issue #355: build.rs compiles a glibc-2.38-compat shim
# (glibc_compat.c) on Linux/glibc only. Without `build = "build.rs"`
# Cargo skips it. See the script's header comment for rationale.
build = "build.rs"

[package.metadata.cargo-machete]
ignored = ["cc"]

[lib]
name = "_core"
crate-type = ["cdylib"]
# Disable the default test harness — Rust `cargo test` can't run a cdylib that
# links against libpython without LD/DYLD setup. Tests for this crate happen
# on the Python side (via `maturin develop` + pytest/smoke).
test = false
doctest = false
bench = false

[features]
default = []
# `extension-module` is what every maturin invocation enables (via
# `[tool.maturin] features` in the Python package metadata), so tying `ml`
# to it keeps ALL shipped wheels and `maturin develop` extensions on the
# ONNX-backed paths with no per-invocation flags — while plain `cargo
# build`/`cargo test` stays on the fast lexical default. Do NOT put
# `features = ["ml"]` on the headroom-core dep edge below: an unconditional
# edge re-enables ml for the whole workspace build (feature unification)
# and the lean default is lost.
ml = ["headroom-core/ml"]
extension-module = ["pyo3/extension-module", "ml"]

[dependencies]
headroom-core = { path = "../headroom-core" }
pyo3 = { workspace = true }
pyo3-log = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Compile the C shim into a static library that links into _core.so.
# `cc` is already transitively in our build graph (used by aws-lc-rs,
# zstd-sys, ring, etc) so this is not a new cold dep.
cc = "1"

[lints]
workspace = true
